name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Prisma generate and schema push
        run: npx prisma generate && npx prisma db push
      - name: Seed database (smoke-tests the Prisma 7 client and adapter)
        run: node prisma/seed.js
      - name: Server boots and answers requests
        env:
          JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
          PORT: "3999"
        run: |
          node server.js & pid=$!
          for i in $(seq 1 20); do curl -sf -o /dev/null -X POST localhost:3999/api/login -H 'content-type: application/json' -d '{"email":"reporter@test.com","password":"password"}' && break; sleep 1; done
          curl -sf -X POST localhost:3999/api/login -H 'content-type: application/json' -d '{"email":"reporter@test.com","password":"password"}' | grep -q token
          kill $pid

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
